[package]
name = "ruster-compositor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ruster-compositor"
path = "src/main.rs"

[features]
default = ["winit"]
winit = ["smithay/backend_winit"]
udev = ["smithay/backend_udev", "smithay/backend_drm", "smithay/backend_gbm", "smithay/backend_egl", "smithay/backend_libinput", "smithay/backend_session_libseat", "smithay/renderer_multi"]

[dependencies]
ruster-shell = { path = "../ruster-shell" }
ruster-render = { path = "../ruster-render" }
ruster-picker = { path = "../ruster-picker" }
ruster-render-gles = { path = "../ruster-render-gles" }
ruster-core = { path = "../ruster-core" }
ruster-syntax = { path = "../ruster-syntax" }
ruster-lsp = { path = "../ruster-lsp" }
arboard = "3"
ruster-lua = { path = "../ruster-lua" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Smithay is Linux-only; off Linux the lib is empty and the bin is a stub that
# exits with an explanatory error. `ctrlc` (signal handler for the compositor
# loop) and `png` (DRM screenshot encoder) only run on that platform, so they
# belong to the same gate and do not need to compile on macOS/Windows.
#
# `arboard` stays unconditional: ruster-core already pulls it on every
# platform for the editor's clipboard, so gating the compositor's copy would
# not save any build time.
[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
png = "0.18"
smithay = { version = "0.7", default-features = false, features = ["renderer_gl", "wayland_frontend", "desktop"] }
# wlr-screencopy, which smithay 0.7 does not implement — the protocol bindings
# are generated here and the handlers are ours. Already in the tree as a
# transitive dependency of smithay, so this costs a feature flag rather than a
# crate.
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
