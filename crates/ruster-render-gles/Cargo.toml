[package]
name = "ruster-render-gles"
version = "0.1.0"
edition = "2021"

[dependencies]
ruster-render = { path = "../ruster-render" }
ruster-render-elements = { path = "../ruster-render-elements" }
tracing = "0.1"

# Smithay, and the only consumer of cosmic-text, are Linux-only. Off Linux this
# crate compiles to an empty lib, so off-Linux builds should not pay for
# pulling cosmic-text (and its font/swash stack) into the dep graph.
[target.'cfg(target_os = "linux")'.dependencies]
cosmic-text = "0.19"
smithay = { version = "0.7", default-features = false, features = ["renderer_gl", "wayland_frontend", "backend_winit"] }
