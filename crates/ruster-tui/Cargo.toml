[package]
name = "ruster-tui"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
ruster-core = { path = "../ruster-core" }
ruster-render = { path = "../ruster-render" }
ruster-syntax = { path = "../ruster-syntax" }
ruster-lua = { path = "../ruster-lua" }
ruster-lsp = { path = "../ruster-lsp" }
ruster-terminal = { path = "../ruster-terminal" }
ruster-project = { path = "../ruster-project" }
serde_json = "1"
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
dirs = "5"
nucleo-matcher = "0.3"
ignore = "0.4"
