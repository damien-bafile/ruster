name: Rust

on:
  # Every branch, not just main. Long-lived branches are the norm here — the
  # compositor lived on one for 97 commits — and with `main` alone a branch is
  # checked only while a pull request happens to be open against it. Four
  # commits reached `compositor` after its last PR run and were merged carrying
  # a `cargo fmt --check` failure, which is CI's *first* step: nothing after it
  # had been run on that code either.
  #
  # A branch with an open PR therefore builds twice, once per trigger. That is
  # the price of a branch without one being built at all, and the concurrency
  # group below at least keeps a fast series of pushes from queueing up runs
  # nobody will read.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

# One run per ref: pushing three times in a minute should test the third commit,
# not all three. Superseded runs are cancelled rather than left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    # ripgrep backs the `:Rg` command; install it so its tests have `rg` on PATH.
    # On Linux the raylib crate also builds from source and needs X11/GL headers.
    - name: Install ripgrep + raylib build deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep \
          libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
          libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
          libseat-dev libinput-dev libgbm-dev libdrm-dev libudev-dev
    - name: Install ripgrep (macOS)
      if: runner.os == 'macOS'
      run: brew install ripgrep
    - name: Install ripgrep (Windows)
      if: runner.os == 'Windows'
      run: choco install ripgrep -y

    # Formatting is deterministic and platform-independent, so one runner is
    # enough. Runs before the build so a formatting-only failure is obvious
    # rather than buried under a compile.
    - name: Formatting
      if: runner.os == 'Linux'
      run: cargo fmt --all --check

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    # Clippy runs on every platform, not just Linux. Lints themselves are
    # portable, but the *code* is not: `#[cfg(...)]` arms are only compiled on
    # the platform they target, so a Linux-only lint job never sees the
    # `cfg(not(target_os = "linux"))` fallbacks at all. --all-targets covers
    # test code too, where several past findings lived.
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    # The compositor's DRM backend is behind the `udev` feature, which is off by
    # default — so none of it is built, tested or linted by the steps above.
    # That is the code that only runs on real hardware and is hardest to
    # exercise by hand, which makes it the code least able to afford being
    # invisible to CI. Linux only: the feature does not exist elsewhere.
    - name: Build, test and lint the DRM backend (Linux)
      if: runner.os == 'Linux'
      run: |
        cargo test -p ruster-compositor --features ruster-compositor/udev --verbose
        cargo clippy -p ruster-compositor --features ruster-compositor/udev \
          --all-targets -- -D warnings
