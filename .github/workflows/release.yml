name: Release

# Build a distributable Windows binary when a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-exe:
    name: Build ruster.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruster-windows-x86_64
          path: target/release/ruster.exe
          if-no-files-found: error

      # Attach the exe to the GitHub Release when this run was triggered by a tag.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/ruster.exe
